<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Ishan Ghosh — software engineer profile</title>
  <desc id="desc">Animated dark technical landscape with a glowing network, terminal prompt, and engineering motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090d"/>
      <stop offset="0.55" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#12172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65e6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#65e6ff"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#65e6ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#65e6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9aa4b2" stroke-opacity="0.08"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1600" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="24" fill="url(#grid)"/>

  <ellipse cx="1260" cy="150" rx="210" ry="170" fill="url(#orb)" filter="url(#blur)"/>
  <ellipse cx="300" cy="400" rx="190" ry="120" fill="#a78bfa" opacity="0.12" filter="url(#blur)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M980 90L1180 220L1390 110L1510 260L1280 390L1050 310L1180 220" stroke="#65e6ff" stroke-opacity="0.38" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.18;0.58;0.18" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M950 420L1120 335L1280 390L1460 350" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.12;0.45;0.12" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <circle cx="980" cy="90" r="5" fill="#65e6ff">
      <animate attributeName="r" values="4;8;4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="220" r="5" fill="#ffffff">
      <animate attributeName="r" values="4;9;4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1390" cy="110" r="5" fill="#a78bfa">
      <animate attributeName="r" values="4;8;4" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1280" cy="390" r="5" fill="#65e6ff">
      <animate attributeName="r" values="4;8;4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(84 96)">
    <rect x="0" y="0" width="760" height="310" rx="18" fill="#0a0d13" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="28" cy="28" r="5" fill="#ff6b6b"/>
    <circle cx="46" cy="28" r="5" fill="#ffd166"/>
    <circle cx="64" cy="28" r="5" fill="#70e000"/>

    <text x="32" y="86" fill="#8390a3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">~/ishan</text>
    <text x="32" y="126" fill="#65e6ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">$ whoami</text>
    <text x="32" y="164" fill="#f5f7fa" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700">Ishan Ghosh</text>
    <text x="32" y="202" fill="#b9c2d0" font-family="Inter,Arial,sans-serif" font-size="20">software engineer · full-stack · AI systems</text>
    <text x="32" y="242" fill="#65e6ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">build → measure → automate → repeat</text>
    <rect x="32" y="272" width="265" height="3" rx="2" fill="url(#glow)">
      <animate attributeName="x" values="32;430;32" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g opacity="0.75" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#8d99aa">
    <text x="1030" y="470">NEXT.JS</text>
    <text x="1135" y="470">PYTHON</text>
    <text x="1240" y="470">JAVA</text>
    <text x="1310" y="470">CV</text>
    <text x="1365" y="470">AI</text>
  </g>

  <g opacity="0.9">
    <rect x="940" y="42" width="220" height="2" fill="#65e6ff">
      <animate attributeName="x" values="940;1180;940" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="1240" y="450" width="210" height="2" fill="#a78bfa">
      <animate attributeName="x" values="1240;1030;1240" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>