name: Git Koi

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  git-koi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: yalongwastaken/git-koi@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
