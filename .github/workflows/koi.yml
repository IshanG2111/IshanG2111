name: Git Koi

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows you to run it manually

jobs:
  git-koi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yalongwastaken/git-koi@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
